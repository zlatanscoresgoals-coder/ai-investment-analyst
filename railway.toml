# Railway config-as-code (repo root).
# Builder must be RAILPACK or DOCKERFILE — "nixpacks" is invalid and breaks the build.
# Root requirements.txt includes backend via: -r backend/requirements.txt

[build]
builder = "RAILPACK"

[deploy]
startCommand = "bash -lc 'AUTH_ENABLED=${AUTH_ENABLED:-true}; export AUTH_ENABLED; if [ \"$AUTH_ENABLED\" = \"true\" ] && { [ -z \"${AUTH_PASSWORD:-}\" ] || [ \"$AUTH_PASSWORD\" = \"GoatAnalyst99\" ]; }; then echo \"Set AUTH_PASSWORD to a strong secret before deploying with authentication enabled.\" >&2; exit 1; fi; uvicorn app.main:app --host 0.0.0.0 --port $PORT'"
restartPolicyType = "ON_FAILURE"
